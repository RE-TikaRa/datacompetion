[project]
name = "ai-opportunity"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "huggingface-hub>=2.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "onnxruntime>=1.31.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "reportlab>=5.1.0",
    "scikit-learn>=1.9.1",
    "tokenizers>=0.23.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
